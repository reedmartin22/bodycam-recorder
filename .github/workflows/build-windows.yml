name: Build Windows executable

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --windowed --name BodyCamRecorder recorder/__main__.py

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/BodyCamRecorder/BodyCamRecorder.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($null -ne $process.ExitCode -and $process.ExitCode -ne 0) {
            throw "Packaged app exited with code $($process.ExitCode)"
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id
          }

      - name: Add default device registry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/BodyCamRecorder/data | Out-Null
          Copy-Item data/devices.json dist/BodyCamRecorder/data/devices.json -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BodyCamRecorder-windows
          path: dist/BodyCamRecorder
